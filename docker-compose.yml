services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No public port in production; uncomment for local dev:
    # ports:
    #   - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # No public port in production; uncomment for local dev:
    # ports:
    #   - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 128M

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@postgres:5432/bot
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./src:/app/src
      - ./locales:/app/locales
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    # Security: read-only filesystem where possible
    # read_only: true  # uncomment if you don't need SQLite writes
    # tmpfs:
    #   - /tmp

volumes:
  pgdata:
  redisdata:
