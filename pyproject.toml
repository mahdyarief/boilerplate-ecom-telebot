[project]
name = "boilerplate-ecom-telebot"
version = "0.1.0"
description = "Production-ready Python Telegram shop bot boilerplate (aiogram 3, SQLAlchemy 2, PostgreSQL, Redis, i18n)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

dependencies = [
    # ── telegram framework ───────────────────────────────
    "aiogram>=3.13,<4",
    # ── persistence ─────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.30,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "aiosqlite>=0.20,<1",
    # ── settings / validation ────────────────────────────
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4,<3",
    "python-dotenv>=1.0,<2",
    # ── fsm + cache ──────────────────────────────────────
    "redis>=5.0,<6",
    "aiogram-fsm-storage-redis>=1.1,<2",
    # ── i18n ─────────────────────────────────────────────
    "aiogram-i18n>=1.4,<2",
    "babel>=2.16,<3",
    # ── observability ────────────────────────────────────
    "structlog>=24.1,<25",
    # ── aiohttp server (for webhook) ─────────────────────
    "aiohttp>=3.10,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "aioresqlite>=0.20,<1",
    "pre-commit>=3.7,<5",
    "types-redis>=4.6,<5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "C4", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"src/bot_app/features/*/handlers.py" = ["B008"]
"src/bot_app/main.py" = ["B008"]
"tests/**/*.py" = ["B011"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = [
    "migrations/",
    "tests/",
    "docs/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src/bot_app --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/bot_app"]
omit = ["*/migrations/*", "*/tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
