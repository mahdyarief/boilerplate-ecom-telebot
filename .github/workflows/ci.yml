name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: PYTHONPATH=src python -m pytest -q --no-cov
        env:
          BOT_TOKEN: "test:token"

      - name: Lint with ruff
        run: PYTHONPATH=src python -m ruff check src tests

      - name: Type check
        run: PYTHONPATH=src python -m mypy src --ignore-missing-imports || true
